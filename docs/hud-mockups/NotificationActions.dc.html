<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HUD notification actions (proposal)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<!-- PROPOSAL (docs/INTERACTION.md, section 4). A tap on a notification card opens its actions; the countdown
     stops. Swipe moves the focus (outlined row), tap fires it, double tap closes the card. Rows are 52 px tall,
     26 px labels. The focused row is outlined at 100 %, the others sit at 60 %. -->
<div style="width: 480px; height: 398px; background: #000; color: {{g}}; font-family: 'Barlow Semi Condensed', sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; left: 14px; top: 54px; width: 452px; box-sizing: border-box; border: 2px solid currentColor; border-radius: 12px; padding: 12px 16px 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 17px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.7; line-height: 24px">MESSAGES · SAM CARTER</span>
<span style="font-size: 17px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.7">HOLD</span>
</div>
<div style="font-size: 22px; font-weight: 600; line-height: 28px; opacity: 0.9; margin: 4px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Are we still on for dinner tonight?</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 52px; box-sizing: border-box; border: 2px solid currentColor; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 26px; font-weight: 700"><span>On my way</span><span style="font-size: 17px; letter-spacing: 0.12em; opacity: 0.7">TAP</span></div>
<div style="height: 52px; box-sizing: border-box; border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; font-size: 26px; font-weight: 600; opacity: 0.6"><span>OK</span></div>
<div style="height: 52px; box-sizing: border-box; border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; font-size: 26px; font-weight: 600; opacity: 0.6"><span>Can't talk now</span></div>
<div style="height: 52px; box-sizing: border-box; border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; font-size: 26px; font-weight: 600; opacity: 0.6"><span>Dismiss</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"g":{"editor":"color","default":"#3DFF8A","options":["#3DFF8A","#7CFFB0","#00E676"]},"$preview":{"width":480,"height":398}}'>
class Component extends DCLogic {
renderVals() {
return { g: this.props.g ?? '#3DFF8A' };
}
}
</script>
</body>
</html>
