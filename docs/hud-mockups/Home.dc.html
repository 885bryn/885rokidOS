<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HUD home menu (proposal)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<!-- PROPOSAL (docs/INTERACTION.md, section 2). Root of the app. Swipe moves the focus, tap opens the row,
     double tap goes back (on Home the system takes it and shows the Rokid menu). Rows 56 px, labels 30 px,
     header 18 px. At most 4 rows show; the list scrolls. -->
<div style="width: 480px; height: 398px; background: #000; color: {{g}}; font-family: 'Barlow Semi Condensed', sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; left: 18px; top: 64px; width: 444px">
<div style="font-size: 18px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.7; line-height: 26px; margin-bottom: 8px">885ROKIDOS</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; box-sizing: border-box; border: 2px solid currentColor; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 30px; font-weight: 700"><span>Now playing</span><span style="font-size: 20px; font-weight: 600; opacity: 0.8">Midnight City</span></div>
<div style="height: 56px; box-sizing: border-box; border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 30px; font-weight: 600; opacity: 0.6"><span>Notifications</span><span style="font-size: 20px">3</span></div>
<div style="height: 56px; box-sizing: border-box; border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; font-size: 30px; font-weight: 600; opacity: 0.6"><span>Navigation</span></div>
<div style="height: 56px; box-sizing: border-box; border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; font-size: 30px; font-weight: 600; opacity: 0.6"><span>Settings</span></div>
</div>
<div style="font-size: 17px; font-weight: 600; opacity: 0.5; margin-top: 10px; letter-spacing: 0.06em">SWIPE  MOVE · TAP  OPEN · 2× TAP  BACK</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"g":{"editor":"color","default":"#3DFF8A","options":["#3DFF8A","#7CFFB0","#00E676"]},"$preview":{"width":480,"height":398}}'>
class Component extends DCLogic {
renderVals() {
return { g: this.props.g ?? '#3DFF8A' };
}
}
</script>
</body>
</html>
