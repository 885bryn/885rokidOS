<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HUD notification card (no trip)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<!-- Phone notification with no trip: nothing else on screen. The card is 452 wide, wraps the text over up
     to 6 lines of 22 px and ends the last line with an ellipsis. Shown 6 s, longer for longer text (up to
     15 s); a tap hides it. On a trip the card is narrower (222 wide, 4 lines of 20 px, right of the turn
     arrow in the corner view) and a detour offer hides it. Sizes: app 17/700, title 26/700, text 22/600. -->
<div style="width: 480px; height: 398px; background: #000; color: {{g}}; font-family: 'Barlow Semi Condensed', sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; left: 14px; top: 90px; width: 452px; box-sizing: border-box; border: 2px solid currentColor; border-radius: 12px; padding: 12px 16px 14px">
<div style="font-size: 17px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.7; line-height: 24px">MESSAGES</div>
<div style="font-size: 26px; font-weight: 700; line-height: 34px; margin-top: 2px">Sam Carter</div>
<div style="font-size: 22px; font-weight: 600; line-height: 28px; opacity: 0.9; margin-top: 4px">Hey, are we still on for dinner tonight? I booked a table at the new place on Main Street for 7:30, but I can move it to 8 if you need more…</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"g":{"editor":"color","default":"#3DFF8A","options":["#3DFF8A","#7CFFB0","#00E676"]},"$preview":{"width":480,"height":398}}'>
class Component extends DCLogic {
renderVals() {
return { g: this.props.g ?? '#3DFF8A' };
}
}
</script>
</body>
</html>
